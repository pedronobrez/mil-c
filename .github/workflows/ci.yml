name: CI

# MIL-C is developed on macOS. Everything in it is platform-neutral Python,
# so the suite runs on Linux for every push, and on macOS and Windows where a
# mistake would otherwise reach a release: a pull request, a tag, a request.
#
# The installers are built here because there is no other way to build the
# Windows one: a bundle is the interpreter and every compiled extension for
# the machine that built it, and nothing cross-compiles that.
#
#   a tag `v*`            tests on three systems, builds both installers,
#                         creates the release and attaches them
#   Run workflow (manual) the same, without the release: the installers are
#                         left as artefacts of the run

on:
  push:
    branches: [main]
    tags: ["v*"]
    # a change to prose cannot break a build
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # the matrix is what varies rather than a condition on the job, because
      # a job's own `if` cannot see the matrix context. In a private
      # repository a macOS minute is billed as ten and a Windows minute as two.
      matrix:
        include: >-
          ${{ fromJSON(
            (github.event_name == 'pull_request'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/tags/'))
            && '[{"os":"ubuntu-latest","python":"3.13"},
                 {"os":"ubuntu-latest","python":"3.10"},
                 {"os":"macos-latest","python":"3.13"},
                 {"os":"windows-latest","python":"3.13"}]'
            || '[{"os":"ubuntu-latest","python":"3.13"},
                 {"os":"ubuntu-latest","python":"3.10"}]'
          ) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PyQt6 needs these even without a screen: they are linked at import
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pillow

      # Linux gets a real X server: in MIL-Q, Qt's offscreen platform
      # segfaulted there inside pyqtgraph's own constructors, and nowhere else
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q
          else
            QT_QPA_PLATFORM=offscreen python -m pytest -q
          fi

      - name: The whole route, from the command line
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m milc selftest
          else
            QT_QPA_PLATFORM=offscreen python -m milc selftest
          fi

  package:
    # Nothing is signed. On macOS that costs nothing until the file travels:
    # Gatekeeper reacts to the quarantine attribute a download attaches. On
    # Windows SmartScreen will warn until there is a certificate.
    #
    # Apple Silicon only. numba, which FlowSOM and UMAP are compiled with,
    # no longer publishes wheels for Intel Macs.
    name: Package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      # make_dmg.sh builds the application, asks it to test itself and wraps it
      - name: Application and disk image
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "$PWD/dist"

      - name: Application
        if: runner.os == 'Windows'
        run: python -m PyInstaller packaging/milc.spec --noconfirm

      # the bundle either runs UMAP, tSNE and FlowSOM and writes a figure or
      # it does not, and this is the only way to find out without a person.
      # A windowed program has no console on Windows, and an error there is a
      # dialog nobody can dismiss: the self-test writes to a file instead and
      # only ever exits.
      - name: The application works
        if: runner.os == 'Windows'
        shell: bash
        run: |
          status=0
          QT_QPA_PLATFORM=offscreen ./dist/MIL-C/MIL-C.exe selftest --log selftest.log || status=$?
          cat selftest.log || true
          [ $status -eq 0 ] || exit $status
          # the way a double click takes, start to finish
          QT_QPA_PLATFORM=offscreen ./dist/MIL-C/MIL-C.exe gui --quit-after 3

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (Select-String -Path milc/__init__.py `
            -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          wix build packaging/milc.wxs -d Version=$version `
            -d BundleDir="$PWD\dist\MIL-C" `
            -d IconFile="$PWD\packaging\icons\MIL-C.ico" `
            -o "dist/MIL-C-$version-windows-x64.msi"

      # The same folder the installer wraps, zipped: unpack it anywhere and
      # run MIL-C.exe. For a machine whose administrator will not let an
      # installer run.
      - name: Portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path milc/__init__.py `
            -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          Compress-Archive -Path dist/MIL-C -DestinationPath `
            "dist/MIL-C-$version-windows-x64.zip" -CompressionLevel Optimal

      # a glob that matches nothing is not an error to WiX. Every installer
      # here holds a Python interpreter, Qt, numpy and LLVM; anything under
      # 50 MB is empty.
      - name: The installer is not empty
        shell: bash
        run: |
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.zip)
          [ ${#built[@]} -gt 0 ] || { echo "nothing was built" >&2; exit 1; }
          status=0
          for file in "${built[@]}"; do
            size=$(wc -c < "$file")
            printf '%s %s bytes\n' "$file" "$size"
            [ "$size" -ge 50000000 ] || { echo "  too small to hold the application" >&2; status=1; }
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: milc-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

      # a build artefact expires; a release does not
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          built=(dist/*.dmg dist/*.msi dist/*.zip)
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            --title "MIL-C ${GITHUB_REF_NAME}" 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${built[@]}" --clobber

  checksums:
    # over the files downloaded back from the release: the bytes a person
    # actually gets
    name: Checksums
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Sum what the release serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.dmg' --pattern '*.msi' --pattern '*.zip'
          sha256sum MIL-C-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber \
            --repo "${GITHUB_REPOSITORY}"
