[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milc"
dynamic = ["version"]
description = "Cytometry: balanced concatenation, UMAP / tSNE / FlowSOM and figures that can be published"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "numba>=0.59",
    "umap-learn>=0.5",
    "openTSNE>=1.0",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
]

[project.scripts]
milc = "milc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "milc.__version__" }

[tool.setuptools.packages.find]
include = ["milc*"]

[tool.setuptools.package-data]
milc = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `real` tests are asserted against the acquisitions in Data/, which are
# never committed; they skip themselves where the folder is missing
markers = ["real: a regression over real data outside the repository"]
